services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: atlax_api
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      # Mount the local data directory so the API can read the journal.sqlite 
      # generated by the native Windows MT5 scanner
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - atlax_net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: atlax_dashboard
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - atlax_net

networks:
  atlax_net:
    driver: bridge
