services:
  postgres:
    image: postgres:16-alpine
    container_name: atlax_postgres
    environment:
      POSTGRES_DB: ${ATLAX_POSTGRES_DB:?Set ATLAX_POSTGRES_DB in .env}
      POSTGRES_USER: ${ATLAX_POSTGRES_USER:?Set ATLAX_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${ATLAX_POSTGRES_PASSWORD:?Set ATLAX_POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - atlax_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${ATLAX_POSTGRES_USER} -d ${ATLAX_POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - atlax_net

volumes:
  atlax_postgres_data:

networks:
  atlax_net:
    driver: bridge
