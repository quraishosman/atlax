      require_htf_trend_alignment: false
      min_confidence_threshold: 55
    - name: swing_trader
      enabled: true
      allowed_timeframes:
        - H4
        - D1
      require_session_alignment: false
      require_htf_trend_alignment: false
      min_confidence_threshold: 55
