  enabled: true
  min_parent_range_atr_multiple: 0.5
  min_parent_body_ratio: 0.25
  max_sweep_retracement_pct: 0.55
  quality_tightening:
    enabled: true
    shadow_mode: true
    version: '1.0'
    min_parent_range_atr_multiple: 0.75
    min_parent_body_ratio: 0.38
    max_sweep_retracement_pct: 0.55
