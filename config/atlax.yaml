  max_gap_tolerance_pips: 0.0005
  price_comparison_tolerance_pips: 0.00001
  pip_size: 0.0001
  allowed_timeframes:
    - M5
    - M15
    - M30
    - H1
    - H4
    - D1
    - W1
    - MN
  timeframe_pairings:
    MN: D1
    W1: H4
    D1: H1
    H4: M15
    H1: M5
  kill_zones:
    - name: London Open
      utc_start: '02:00'
      utc_end: '05:00'
    - name: New York AM
      utc_start: '12:00'
      utc_end: '15:00'
